version: "3.9"

services:
  devtasker-api:
    container_name: devtasker-api
    build:
      context: .
      dockerfile: DevTasker.Api/Dockerfile   # adjust path if needed
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
    depends_on:
      - splunk
    # Send container logs directly to Splunk's HEC endpoint
    logging:
      driver: splunk
      options:
        splunk-url: "https://splunk:8088"           # talks to Splunk container by service name
        splunk-token: "${SPLUNK_HEC_TOKEN}"        # set in .env after you create a HEC token
        splunk-insecureskipverify: "true"          # OK for local dev; use proper certs in prod
        splunk-index: "main"
        splunk-source: "DevTasker.Api"
        splunk-sourcetype: "docker:aspnetcore"

  splunk:
    image: splunk/splunk:latest
    container_name: splunk
    environment:
      SPLUNK_START_ARGS: "--accept-license"        # auto-accept license on first start :contentReference[oaicite:2]{index=2}
      SPLUNK_PASSWORD: "${SPLUNK_ADMIN_PASSWORD}"  # admin password (set in .env)
    ports:
      - "8000:8000"   # Splunk Web UI
      - "8088:8088"   # HEC (HTTP Event Collector)
    volumes:
      - splunk-etc:/opt/splunk/etc
      - splunk-var:/opt/splunk/var

volumes:
  splunk-etc:
  splunk-var:
